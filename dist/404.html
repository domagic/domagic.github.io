<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面未找到 · 秦罗万象</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;color:#e8e6e1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{max-width:36rem;padding:2rem;text-align:center}
    h1{font-size:1.6rem;font-weight:500;letter-spacing:.04em}
    p{color:#a9a49a;line-height:1.7}
    a{color:#d9b26a;text-decoration:none;border-bottom:1px solid rgba(217,178,106,.5)}
    </style>
  </head>
<body>
  <main>
    <h1>页面未找到</h1>
    <p>你访问的地址不存在或已移动。<a href="/">返回团队主页</a></p>
  </main>
  <script>
    (function () {
      try {
        var p = location.pathname
        if (p.indexOf('/magic/') === 0) {
          sessionStorage.setItem('magic:redirect', p + location.search + location.hash)
          location.replace('/magic/index.html')
        }
      } catch (e) {}
    })()
  </script>
</body>
</html>
