    <!--
      CSP 基线（04-安全设计.md §6）。frame-ancestors 仅响应头有效，meta 中会被浏览器忽略，
      GitHub Pages 无法自定义响应头 → 此项为已知残留风险，迁移托管后补 HTTP 头。
      字体已自托管（T7-①）：public/fonts/（woff2 子集 + OFL 许可），第三方字体源已从放行列表移除。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'self' https://api.domagic.invalid; base-uri 'self'; form-action 'self'; object-src 'none'"
    />

    <!-- T7-③ 首屏字体优化：
         critical.css（阻塞式，≈8KB）定义关键 CJK 子集 face（Noto Serif SC Critical 600/700/900 + Noto Sans SC Critical 变体）
         与 Fraunces/Plex Mono 拉丁子集，font-display:swap：首屏文本先以同度量系统 CJK 字体（advance=1em）立即绘制，
         关键子集到达后无位移交换为 Noto，LCP 不被字体下载阻塞。高优先级预载关键子集，使其尽早交换到位
         （实测：去掉预载会让字体落入 TBT/样式重算窗口，移动端反而劣化，故保留全部预载）。
         fonts.css（全量 526 face，供下折叠/其他页回退）非阻塞（media=print，由 main.ts 翻转为 all），移出关键渲染路径。
         CSP script-src 'self' 禁止内联 onload，故由 main.ts 翻转。 -->
